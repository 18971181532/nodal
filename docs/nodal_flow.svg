<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="1240" viewBox="0 0 1160 1240" font-family="Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
  <defs>
    <marker id="arr" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#8ea0bd"/>
    </marker>
    <marker id="arrT" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#2dd4bf"/>
    </marker>
    <marker id="arrA" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#fbbf24"/>
    </marker>
  </defs>
  <rect width="1160" height="1240" fill="#0b1220"/>
  <text x="580" y="34" fill="#e2e8f0" font-size="20" font-weight="700" text-anchor="middle">Nodal 仿真流水线</text>

  <!-- netlist -->
  <rect x="440" y="56" width="280" height="76" rx="10" fill="#0e1626" stroke="#2dd4bf" stroke-width="1.6"/>
  <text x="580" y="82" fill="#e2e8f0" font-size="13" text-anchor="middle">网表文本 (.cir)</text>
  <text x="580" y="100" fill="#8ea0bd" font-size="11" text-anchor="middle">R C L V I D E G F H</text>
  <text x="580" y="116" fill="#8ea0bd" font-size="11" text-anchor="middle">.op .tran .ac .dc .model .print</text>
  <line x1="580" y1="132" x2="580" y2="166" stroke="#8ea0bd" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- parser -->
  <rect x="440" y="170" width="280" height="76" rx="10" fill="#111a2c" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="580" y="196" fill="#e2e8f0" font-size="13" text-anchor="middle">netlist.py 解析器</text>
  <text x="580" y="214" fill="#8ea0bd" font-size="11" text-anchor="middle">词法(括号分组) · 工程后缀 · 续行/注释</text>
  <text x="580" y="230" fill="#8ea0bd" font-size="11" text-anchor="middle">校验: 地节点 / 重名 / 模型引用</text>
  <line x1="580" y1="246" x2="580" y2="280" stroke="#8ea0bd" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- mna -->
  <rect x="440" y="284" width="280" height="76" rx="10" fill="#111a2c" stroke="#60a5fa" stroke-width="1.6"/>
  <text x="580" y="310" fill="#e2e8f0" font-size="13" text-anchor="middle">mna.py System</text>
  <text x="580" y="328" fill="#8ea0bd" font-size="11" text-anchor="middle">未知量 = 节点电压(除地) + V/L/E/H 支路电流</text>
  <text x="580" y="344" fill="#8ea0bd" font-size="11" text-anchor="middle">元件戳记 stamp → A·x = b</text>
  <line x1="580" y1="360" x2="580" y2="394" stroke="#8ea0bd" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- decision -->
  <polygon points="580,398 668,442 580,486 492,442" fill="#0e1626" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="580" y="447" fill="#e2e8f0" font-size="13" text-anchor="middle">分析模式?</text>

  <!-- branches -->
  <path d="M492,442 L230,442 L230,520" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="330" y="432" fill="#8ea0bd" font-size="11">op / dc</text>
  <line x1="580" y1="486" x2="580" y2="520" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="592" y="508" fill="#8ea0bd" font-size="11">tran</text>
  <path d="M668,442 L950,442 L950,520" fill="none" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="800" y="432" fill="#8ea0bd" font-size="11">ac</text>

  <rect x="120" y="524" width="220" height="70" rx="10" fill="#111a2c" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="230" y="550" fill="#e2e8f0" font-size="12" text-anchor="middle">op / dc</text>
  <text x="230" y="568" fill="#8ea0bd" font-size="11" text-anchor="middle">C 开路 · L 短路</text>
  <text x="230" y="584" fill="#8ea0bd" font-size="11" text-anchor="middle">DC 扫描 warm-start</text>

  <rect x="460" y="524" width="240" height="70" rx="10" fill="#111a2c" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="580" y="550" fill="#e2e8f0" font-size="12" text-anchor="middle">tran 伴随模型</text>
  <text x="580" y="568" fill="#8ea0bd" font-size="11" text-anchor="middle">trap: g=2C/h · be: g=C/h</text>
  <text x="580" y="584" fill="#8ea0bd" font-size="11" text-anchor="middle">历史源 ieq / veq 进入 RHS</text>

  <rect x="830" y="524" width="240" height="70" rx="10" fill="#111a2c" stroke="#a78bfa" stroke-width="1.6"/>
  <text x="950" y="550" fill="#e2e8f0" font-size="12" text-anchor="middle">ac 小信号</text>
  <text x="950" y="568" fill="#8ea0bd" font-size="11" text-anchor="middle">工作点线性化: gd · jωC · jωL</text>
  <text x="950" y="584" fill="#8ea0bd" font-size="11" text-anchor="middle">dec / oct / lin 频率网格</text>

  <!-- newton -->
  <path d="M230,594 L230,660 L360,660" fill="none" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="580" y1="594" x2="580" y2="640" stroke="#f87171" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="300" y="644" width="380" height="104" rx="10" fill="#111a2c" stroke="#f87171" stroke-width="1.6"/>
  <text x="490" y="670" fill="#e2e8f0" font-size="12" text-anchor="middle">牛顿-拉夫逊迭代 (analysis.py)</text>
  <text x="490" y="690" fill="#8ea0bd" font-size="11" text-anchor="middle">二极管线性化: gd + ieq = i(vd) − gd·vd</text>
  <text x="490" y="708" fill="#8ea0bd" font-size="11" text-anchor="middle">SPICE 结限幅 vcrit = nVT·ln(nVT/(√2·IS))</text>
  <text x="490" y="726" fill="#8ea0bd" font-size="11" text-anchor="middle">收敛: Δv &lt; voltol+reltol·|v| 且 Δi &lt; abstol+reltol·|i|</text>

  <!-- step adaptation -->
  <path d="M700,559 L790,559 L790,640" fill="none" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrA)"/>
  <text x="712" y="550" fill="#8ea0bd" font-size="11">每步</text>
  <rect x="760" y="644" width="250" height="80" rx="10" fill="#0e1626" stroke="#fbbf24" stroke-width="1.6"/>
  <text x="885" y="670" fill="#e2e8f0" font-size="12" text-anchor="middle">步长自适应</text>
  <text x="885" y="688" fill="#8ea0bd" font-size="11" text-anchor="middle">失败: dt/2 重试 (至 dt/64)</text>
  <text x="885" y="706" fill="#8ea0bd" font-size="11" text-anchor="middle">成功: 更新历史态, dt×1.5 恢复</text>
  <path d="M760,694 L688,694" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrA)"/>
  <text x="700" y="686" fill="#8ea0bd" font-size="10">不收敛</text>

  <!-- LU -->
  <line x1="490" y1="748" x2="490" y2="790" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrT)"/>
  <path d="M950,594 L950,825 L668,825" fill="none" stroke="#2dd4bf" stroke-width="1.5" marker-end="url(#arrT)"/>
  <text x="962" y="700" fill="#8ea0bd" font-size="11">逐频点</text>
  <rect x="380" y="794" width="280" height="70" rx="10" fill="#111a2c" stroke="#2dd4bf" stroke-width="1.6"/>
  <text x="520" y="820" fill="#e2e8f0" font-size="12" text-anchor="middle">matrix.py 手写 LU</text>
  <text x="520" y="838" fill="#8ea0bd" font-size="11" text-anchor="middle">部分主元高斯消元</text>
  <text x="520" y="854" fill="#8ea0bd" font-size="11" text-anchor="middle">实数 / 复数同一套代码</text>
  <line x1="520" y1="864" x2="520" y2="900" stroke="#8ea0bd" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- solution -->
  <rect x="380" y="904" width="280" height="56" rx="10" fill="#0e1626" stroke="#2dd4bf" stroke-width="1.6"/>
  <text x="520" y="928" fill="#e2e8f0" font-size="13" text-anchor="middle">解向量 x</text>
  <text x="520" y="946" fill="#8ea0bd" font-size="11" text-anchor="middle">节点电压 / 支路电流 / 复数频响</text>

  <!-- outputs -->
  <path d="M450,960 L290,1010" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr)"/>
  <line x1="520" y1="960" x2="520" y2="1010" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr)"/>
  <path d="M590,960 L800,1010" fill="none" stroke="#4ade80" stroke-width="1.5" marker-end="url(#arr)"/>

  <rect x="160" y="1014" width="230" height="76" rx="10" fill="#111a2c" stroke="#4ade80" stroke-width="1.6"/>
  <text x="275" y="1040" fill="#e2e8f0" font-size="12" text-anchor="middle">measure.py</text>
  <text x="275" y="1058" fill="#8ea0bd" font-size="11" text-anchor="middle">上升时间 / 过冲 / 纹波 / 频率</text>
  <text x="275" y="1074" fill="#8ea0bd" font-size="11" text-anchor="middle">-3dB 带宽 / 峰值增益</text>

  <rect x="430" y="1014" width="220" height="76" rx="10" fill="#111a2c" stroke="#4ade80" stroke-width="1.6"/>
  <text x="540" y="1040" fill="#e2e8f0" font-size="12" text-anchor="middle">visual.py</text>
  <text x="540" y="1058" fill="#8ea0bd" font-size="11" text-anchor="middle">MNA 热图 / 牛顿轨迹</text>
  <text x="540" y="1074" fill="#8ea0bd" font-size="11" text-anchor="middle">降采样 / 基准</text>

  <rect x="700" y="1014" width="280" height="76" rx="10" fill="#111a2c" stroke="#4ade80" stroke-width="1.6"/>
  <text x="840" y="1040" fill="#e2e8f0" font-size="12" text-anchor="middle">cli.py · server.py · web/</text>
  <text x="840" y="1058" fill="#8ea0bd" font-size="11" text-anchor="middle">10 子命令 (--json) · 7 API</text>
  <text x="840" y="1074" fill="#8ea0bd" font-size="11" text-anchor="middle">127.0.0.1:8863 六标签工作台</text>

  <text x="580" y="1160" fill="#8ea0bd" font-size="11" text-anchor="middle">零第三方依赖 · Python ≥ 3.9 · 教学实现（理想化模型，不可用于签核）</text>
</svg>
